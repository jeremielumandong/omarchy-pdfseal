[package]
name = "pdfseal-worker"
version = "1.0.0"
edition = "2024"
publish = false
description = "Local PDF operations for the native PDFSeal Omarchy plugin"

[dependencies]
lopdf = { version = "=0.42.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
encoding_rs = "0.8"
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
roxmltree = "=0.20.0"

[profile.release]
strip = true
lto = "thin"
